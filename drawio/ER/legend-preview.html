<!doctype html><html lang="da"><meta charset="utf-8"><title>ER legend – forhåndsvisning</title><style>body{margin:0;background:#dce3ed}section{margin:20px auto;width:1200px}svg{display:block}nav{font:16px Arial;padding:20px;background:white}a{margin-right:24px}</style><nav><a href="#p0">1 · Grundelementer</a><a href="#p1">2 · Relationer</a><a href="#p2">3 · Attributtyper</a><a href="#p3">4 · Udvidelser</a></nav><section id="p0"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180"><rect x="0" y="0" width="1200" height="1180" fill="#F5F7FB" stroke="none"/><rect x="38" y="25" width="1120" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" font-weight="bold" text-anchor="start"><tspan x="44" y="43">ER / LEGEND                                              1 / 4</tspan></text><rect x="38" y="57" width="1120" height="52" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="32" font-weight="bold" text-anchor="start"><tspan x="44" y="94">Grundelementer</tspan></text><rect x="38" y="114" width="1120" height="66" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="16" text-anchor="start"><tspan x="44" y="135">Vores variant: entiteter med attributrækker og datatyper, kombineret med Chen-relationer.</tspan><tspan x="44" y="155.48">Klassisk Chen bruger rektangler og attribut-ovaler. PK, FK og datatyper er vores tabeltilføjelser.</tspan></text><rect x="38" y="198" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="210" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="234">01  Entitet / entitetstype</tspan></text><rect x="54" y="249" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="269">Hvad: en type ting, person eller begreb i systemet.</tspan><tspan x="60" y="288.2">Brug: én boks pr. type; navn øverst, attributter nedenunder.</tspan></text><rect x="191" y="321" width="240" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="311" y="341.25">user</tspan></text><rect x="191" y="351" width="240" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="196" y="350" width="230" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="202" y="368">PK   id                 UUID</tspan></text><rect x="191" y="375" width="240" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="196" y="374" width="230" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="202" y="392">       name           TEXT</tspan></text><rect x="54" y="423" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="442">Eksempel: user beskriver brugere. En bestemt bruger</tspan><tspan x="60" y="459.92">er én forekomst af entitetstypen.</tspan></text><rect x="612" y="198" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="210" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="234">02  Attribut</tspan></text><rect x="628" y="249" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="269">Hvad: en egenskab ved en entitet.</tspan><tspan x="634" y="288.2">Brug: skriv den som en række i entitetens boks.</tspan></text><rect x="630" y="321" width="220" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="740" y="341.25">task</tspan></text><rect x="630" y="351" width="220" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="635" y="350" width="210" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="641" y="368">       title              TEXT</tspan></text><path d="M930 356 L970 356" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="880" y="333" width="50" height="46" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="905" y="361.25">task</tspan></text><ellipse cx="1045" cy="356" rx="75" ry="22" fill="#E8F5EE" stroke="#5274A6"/><ellipse cx="1045" cy="356" rx="75" ry="22" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="1045" y="361.25">title</tspan></text><rect x="628" y="423" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="442">Eksempel: title beskriver en task. I klassisk Chen</tspan><tspan x="634" y="459.92">vises attributten som en oval forbundet til entiteten.</tspan></text><rect x="38" y="496" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="508" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="532">03  Primærnøgle · PK</tspan></text><rect x="54" y="547" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="567">Hvad: den valgte nøgle, der identificerer hver forekomst.</tspan><tspan x="60" y="586.2">Brug: markér nøglefeltet med PK; værdien er unik og udfyldt.</tspan></text><rect x="56" y="619" width="235" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="173.5" y="639.25">user</tspan></text><rect x="56" y="649" width="235" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="61" y="648" width="225" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="67" y="666">PK   id                 UUID</tspan></text><ellipse cx="441" cy="651" rx="60" ry="22" fill="#E8F5EE" stroke="#5274A6"/><ellipse cx="441" cy="651" rx="60" ry="22" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-decoration="underline" text-anchor="middle"><tspan x="441" y="656.25">id</tspan></text><rect x="54" y="721" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="740">Eksempel: user.id skelner mellem brugere med samme</tspan><tspan x="60" y="757.92">navn. I klassisk Chen understreges nøgleattributten.</tspan></text><rect x="612" y="496" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="508" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="532">04  Sammensat primærnøgle</tspan></text><rect x="628" y="547" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="567">Hvad: flere attributter, der tilsammen identificerer en række.</tspan><tspan x="634" y="586.2">Brug: markér alle felter i den fælles nøgle med PK.</tspan></text><rect x="730" y="619" width="310" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="885" y="639.25">task_participant</tspan></text><rect x="730" y="649" width="310" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="735" y="648" width="300" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="741" y="666">PK, FK   task_id        UUID</tspan></text><rect x="730" y="673" width="310" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="735" y="672" width="300" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="741" y="690">PK, FK   user_id        UUID</tspan></text><rect x="628" y="721" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="740">Eksempel: (task_id, user_id) er unik som par, hvis</tspan><tspan x="634" y="757.92">en bruger kun må deltage én gang pr. task.</tspan></text><rect x="38" y="794" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="806" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="830">05  Fremmednøgle · FK</tspan></text><rect x="54" y="845" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="865">Hvad: et felt, der refererer til en nøgle i en anden tabel.</tspan><tspan x="60" y="884.2">Brug: markér FK og angiv målet; tegn også Chen-relationen.</tspan></text><rect x="121" y="917" width="385" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="313.5" y="937.25">task</tspan></text><rect x="121" y="947" width="385" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="126" y="946" width="375" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="132" y="964">PK   id                       UUID</tspan></text><rect x="121" y="971" width="385" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="126" y="970" width="375" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="132" y="988">FK   created_by          UUID → user.id</tspan></text><rect x="54" y="1019" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="1038">Eksempel: task.created_by refererer til user.id.</tspan><tspan x="60" y="1055.92">PK, FK betyder, at samme felt har begge funktioner.</tspan></text><rect x="612" y="794" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="806" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="830">06  Datatype og domæne / enum</tspan></text><rect x="628" y="845" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="865">Hvad: typen og de tilladte værdier for en attribut.</tspan><tspan x="634" y="884.2">Brug: datatype i rækken; enum-værdier i en kort note.</tspan></text><rect x="630" y="917" width="235" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="747.5" y="937.25">task</tspan></text><rect x="630" y="947" width="235" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="635" y="946" width="225" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="641" y="964">status   TASK_STATUS</tspan></text><rect x="890" y="917" width="255" height="90" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="896" y="937">TASK_STATUS =</tspan><tspan x="896" y="956.2">{DRAFT, PUBLISHED,</tspan><tspan x="896" y="975.4"> COMPLETED}</tspan></text><rect x="628" y="1019" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="1038">Eksempel: status må kun være en værdi i TASK_STATUS.</tspan><tspan x="634" y="1055.92">Datatyper og enums er tilføjelser til den logiske model.</tspan></text><rect x="38" y="1112" width="1120" height="48" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="44" y="1130">Fælles konvention: tabelform for entiteter · Chen-romber for relationer · ingen pile</tspan><tspan x="44" y="1146.64">Eksemplerne viser mulige forretningsregler; vælg reglerne ud fra jeres eget system.</tspan></text></svg></section><section id="p1"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180"><rect x="0" y="0" width="1200" height="1180" fill="#F5F7FB" stroke="none"/><rect x="38" y="25" width="1120" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" font-weight="bold" text-anchor="start"><tspan x="44" y="43">ER / LEGEND                                              2 / 4</tspan></text><rect x="38" y="57" width="1120" height="52" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="32" font-weight="bold" text-anchor="start"><tspan x="44" y="94">Relationer, kardinalitet og deltagelse</tspan></text><rect x="38" y="114" width="1120" height="66" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="16" text-anchor="start"><tspan x="44" y="135">Læs to ting hver for sig: 1 / N / M angiver maksimum; linjen angiver minimum.</tspan><tspan x="44" y="155.48">Tallene læses modsat den entitet, du tager udgangspunkt i. Deltagelse læses på entitetens egen linje.</tspan></text><rect x="38" y="198" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="210" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="234">07  Relation · rombe</tspan></text><rect x="54" y="249" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="269">Hvad: en sammenhæng mellem entiteter.</tspan><tspan x="60" y="288.2">Brug: navngiv romben med et udsagnsord; forbind uden pile.</tspan></text><rect x="56" y="346" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="117" y="375.25">user</tspan></text><polygon points="313,321 366,370 313,419 260,370" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="313" y="375.25">opretter</tspan></text><rect x="448" y="346" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="509" y="375.25">task</tspan></text><path d="M178 370 L260 370" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M366 370 L448 370" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="192" y="335" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="198" y="355">1</tspan></text><rect x="389" y="335" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="395" y="355">N</tspan></text><rect x="54" y="423" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="442">Eksempel: user opretter task. En rombe beskriver</tspan><tspan x="60" y="459.92">forholdet; linjerne viser, hvilke entiteter der deltager.</tspan></text><rect x="612" y="198" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="210" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="234">08  Én-til-én · 1:1</tspan></text><rect x="628" y="249" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="269">Hvad: højst én tilknyttet forekomst i hver retning.</tspan><tspan x="634" y="288.2">Brug: skriv 1 ved begge ender; minimum vises med linjen.</tspan></text><rect x="630" y="346" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="691" y="375.25">user</tspan></text><polygon points="887,321 940,370 887,419 834,370" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="887" y="375.25">har</tspan></text><rect x="1022" y="346" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="1083" y="375.25">user_profile</tspan></text><path d="M752 370 L834 370" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M940 367 L1022 367" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M940 373 L1022 373" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="766" y="335" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="772" y="355">1</tspan></text><rect x="963" y="335" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="969" y="355">1</tspan></text><rect x="628" y="423" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="442">Eksempel: en user har højst én profil. Hver profil</tspan><tspan x="634" y="459.92">tilhører præcis én user (dobbeltlinje ved profilen).</tspan></text><rect x="38" y="496" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="508" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="532">09  Én-til-mange · 1:N</tspan></text><rect x="54" y="547" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="567">Hvad: én forekomst kan være knyttet til mange på den</tspan><tspan x="60" y="586.2">anden side. Brug: 1 ved én-siden og N ved mange-siden.</tspan></text><rect x="56" y="644" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="117" y="673.25">user</tspan></text><polygon points="313,619 366,668 313,717 260,668" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="313" y="673.25">opretter</tspan></text><rect x="448" y="644" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="509" y="673.25">task</tspan></text><path d="M178 668 L260 668" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M366 665 L448 665" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M366 671 L448 671" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="192" y="633" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="198" y="653">1</tspan></text><rect x="389" y="633" width="55" height="24" fill="none" stroke="none"/> th="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="1083" y="971.25">task</tspan></text><path d="M752 966 L834 966" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M940 963 L1022 963" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M940 969 L1022 969" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="766" y="931" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="772" y="951">1</tspan></text><rect x="963" y="931" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="969" y="951">N</tspan></text><rect x="628" y="1019" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="1038">Eksempel: hver task skal have en user som opretter.</tspan><tspan x="634" y="1055.92">Dobbeltlinjen giver min. 1; 1 ved user giver maks. 1.</tspan></text><rect x="38" y="1112" width="1120" height="48" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="44" y="1130">Fælles konvention: tabelform for entiteter · Chen-romber for relationer · ingen pile</tspan><tspan x="44" y="1146.64">Eksemplerne viser mulige forretningsregler; vælg reglerne ud fra jeres eget system.</tspan></text></svg></section><section id="p2"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180"><rect x="0" y="0" width="1200" height="1180" fill="#F5F7FB" stroke="none"/><rect x="38" y="25" width="1120" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" font-weight="bold" text-anchor="start"><tspan x="44" y="43">ER / LEGEND "><tspan x="60" y="442">Eksempel: title er en simpel attribut på task.</tspan><tspan x="60" y="459.92">En almindelig attribut er ikke automatisk en nøgle.</tspan></text><rect x="612" y="198" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="210" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="234">14  Sammensat attribut · forgrening</tspan></text><rect x="628" y="249" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="269">Hvad: en egenskab, der kan opdeles i mindre egenskaber.</tspan><tspan x="634" y="288.2">Brug: forbind hovedovalen til ovaler for delene.</tspan></text><ellipse cx="730" cy="369" rx="70" ry="22" fill="#E8F5EE" stroke="#5274A6"/><ellipse cx="730" cy="369" rx="70" ry="22" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="730" y="374.25">address</tspan></text><path d="M800 369 L940 343" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M800 369 L940 397" fill="none" stroke="#5274A6" stroke-width="1.5"/><ellipse cx="1010" cy="343" rx="70" ry="22" fill="#E8F5EE" stroke="#5274A6"/><ellipse cx="1010" cy="343" rx="70" ry="22" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="1010" y="348.25">street</tspan></text><ellipse cx="1010" cy="397" rx="70" ry="22" fill="#E8F5EE" stroke="#5274A6"/><ellipse cx="1010" cy="397" rx="70" ry="22" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="1010" y="402.25">city</tspan></text><rect x="628" y="423" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="442">Eksempel: address består af street og city. I tabelform</tspan><tspan x="634" y="459.92">kan delene skrives som separate attributrækker.</tspan></text><rect x="38" y="496" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="508" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="532">15  Flerværdig attribut · dobbeltoval</tspan></text><rect x="54" y="547" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="567">Hvad: en egenskab med flere værdier for samme entitet.</tspan><tspan x="60" y="586.2">Brug: en dobbeltoval; i en database typisk en separat tabel.</tspan></text><rect x="106" y="641" width="130" height="50" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="171" y="671.25">user</tspan></text><path d="M236 666 L341 666" fill="none" stroke="#5274A6" stroke-width="1.5"/><ellipse cx="411" cy="666" rx="70" ry="22" fill="#E8F5EE" stroke="#5274A6"/><ellipse cx="411" cy="666" rx="65" ry="17" fill="#E8F5EE" stroke="#5274A6"/><ellipse cx="411" cy="666" rx="70" ry="22" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="411" y="671.25">phone</tspan></text><rect x="54" y="721" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="740">Eksempel: en user kan have flere telefonnumre.</tspan><tspan x="60" y="757.92">Gem ikke listen som kommasepareret tekst i ét felt.</tspan></text><rect x="612" y="496" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="508" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="532">16  Afledt attribut · stiplet oval</tspan></text><rect x="628" y="547" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="567">Hvad: en egenskab, der kan beregnes ud fra andre data.</tspan><tspan x="634" y="586.2">Brug: en stiplet oval; undgå unødig lagring af resultatet.</tspan></text><rect x="630" y="619" width="250" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="755" y="639.25">individual_user</tspan></text><rect x="630" y="649" width="250" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="635" y="648" width="240" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="641" y="666">date_of_birth     DATE</tspan></text><path d="M880 661 L970 661" fill="none" stroke="#5274A6" stroke-width="1.5"/><ellipse cx="1040" cy="661" rx="70" ry="22" fill="#E8F5EE" stroke="#5274A6" stroke-dasharray="6 4"/><ellipse cx="1040" cy="661" rx="70" ry="22" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="1040" y="666.25">age</tspan></text><rect x="628" y="721" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="740">Eksempel: age beregnes fra date_of_birth og dagsdato.</tspan><tspan x="634" y="757.92">Stiplet oval betyder afledt, ikke valgfri.</tspan></text><rect x="38" y="794" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="806" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="830">17  Relationsattribut</tspan></text><rect x="54" y="845" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="865">Hvad: en egenskab ved selve relationen mellem to parter.</tspan><tspan x="60" y="884.2">Brug: forbind en attribut-oval direkte til relationsromben.</tspan></text><rect x="56" y="917" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="117" y="946.25">user</tspan></text><polygon points="313,892 366,941 313,990 260,941" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="313" y="946.25">deltager i</tspan></text><rect x="448" y="917" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="509" y="946.25">task</tspan></text><path d="M178 941 L260 941" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M366 941 L448 941" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="192" y="906" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="198" y="926">M</tspan></text><rect x="389" y="906" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="395" y="926">N</tspan></text><path d="M313 990 L313 993" fill="none" stroke="#5274A6" stroke-width="1.5"/><ellipse cx="313" cy="1005" rx="67" ry="12" fill="#E8F5EE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="313" y="1010.25">joined_at</tspan></text><rect x="54" y="1019" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="1038">Eksempel: joined_at gælder en users deltagelse i en</tspan><tspan x="60" y="1055.92">bestemt task; feltet hører ikke kun til user eller task.</tspan></text><rect x="612" y="794" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="806" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="830">18  Koblingsentitet / koblingstabel</tspan></text><rect x="628" y="845" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="865">Hvad: en entitet, der repræsenterer en M:N-tilknytning.</tspan><tspan x="634" y="884.2">Brug: to 1:N-relationer og FK-felter til de to oprindelige typer.</tspan></text><rect x="725" y="912" width="325" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="887.5" y="932.25">task_participant</tspan></text><rect x="725" y="942" width="325" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="730" y="941" width="315" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="736" y="959">PK, FK   task_id          UUID</tspan></text><rect x="725" y="966" width="325" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="730" y="965" width="315" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="736" y="983">PK, FK   user_id          UUID</tspan></text><rect x="725" y="990" width="325" height="24" fill="#FFFFFF" stroke="#5274A6"/><rect x="730" y="989" width="315" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="736" y="1007">             joined_at       TIMESTAMPTZ</tspan></text><rect x="628" y="1019" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="1038">Eksempel: task_participant forbinder user og task.</tspan><tspan x="634" y="1055.92">Ved én deltagelse pr. par: brug fælles PK eller UNIQUE.</tspan></text><rect x="38" y="1112" width="1120" height="48" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="44" y="1130">Fælles konvention: tabelform for entiteter · Chen-romber for relationer · ingen pile</tspan><tspan x="44" y="1146.64">Eksemplerne viser mulige forretningsregler; vælg reglerne ud fra jeres eget system.</tspan></text></svg></section><section id="p3"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180"><rect x="0" y="0" width="1200" height="1180" fill="#F5F7FB" stroke="none"/><rect x="38" y="25" width="1120" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" font-weight="bold" text-anchor="start"><tspan x="44" y="43">ER / LEGEND                                              4 / 4</tspan></text><rect x="38" y="57" width="1120" height="52" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="32" font-weight="bold" text-anchor="start"><tspan x="44" y="94">Udvidelser og fælles tegneregler</tspan></text><rect x="38" y="114" width="1120" height="66" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="16" text-anchor="start"><tspan x="44" y="135">De følgende symboler bruges kun, når modellen har behov for dem. Specialisering hører til EER.</tspan><tspan x="44" y="155.48">Farver hjælper læsningen, men har ingen selvstændig betydning. Symboler og tekst bærer betydningen.</tspan></text><rect x="38" y="198" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="210" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="234">19  Svag entitet · dobbeltrektangel</tspan></text><rect x="54" y="249" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="269">Hvad: en entitet, der kræver ejerens nøgle for at blive</tspan><tspan x="60" y="288.2">identificeret. Brug: dobbelt ramme og en lokal delnøgle.</tspan></text><rect x="151" y="317" width="325" height="100" fill="#EAF2FF" stroke="#5274A6"/><rect x="156" y="322" width="315" height="90" fill="#FFFFFF" stroke="#5274A6"/><rect x="171" y="326" width="280" height="80" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="177" y="346">task_step</tspan><tspan x="177" y="365.2">PK, FK   task_id</tspan><tspan x="177" y="384.4">PK         step_no  [delnøgle]</tspan></text><rect x="54" y="423" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="442">Eksempel: task_step identificeres af (task_id, step_no).</tspan><tspan x="60" y="459.92">step_no alene er kun unikt inden for den samme task.</tspan></text><rect x="612" y="198" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="210" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="234">20  Identificerende relation · dobbeltrombe</tspan></text><rect x="628" y="249" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="269">Hvad: relationen mellem en svag entitet og dens ejer.</tspan><tspan x="634" y="288.2">Brug: dobbeltrombe; svag entitet har total deltagelse.</tspan></text><rect x="630" y="346" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="691" y="375.25">task</tspan></text><polygon points="887,321 940,370 887,419 834,370" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="887" y="375.25">har</tspan></text><rect x="1022" y="346" width="122" height="48" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="1083" y="375.25">task_step</tspan></text><path d="M752 370 L834 370" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M940 367 L1022 367" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M940 373 L1022 373" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="766" y="335" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="772" y="355">1</tspan></text><rect x="963" y="335" width="55" height="24" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="start"><tspan x="969" y="355">N</tspan></text><polygon points="887,328 932,370 887,412 842,370" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="887" y="375.25">har</tspan></text><rect x="1027" y="351" width="112" height="38" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle"><tspan x="1083" y="375.25">task_step</tspan></text><rect x="628" y="423" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="442">Eksempel: hvert task_step tilhører én task. I klassisk</tspan><tspan x="634" y="459.92">Chen markeres delnøglen med stiplet understregning.</tspan></text><rect x="38" y="496" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="508" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="532">21  Specialisering / undertyper · EER</tspan></text><rect x="54" y="547" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="567">Hvad: en overtype opdeles i mere specifikke typer.</tspan><tspan x="60" y="586.2">Brug: en cirkel mellem overtype og undertyper; nøglen arves.</tspan></text><rect x="246" y="613" width="135" height="30" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="313.5" y="633.25">user</tspan></text><path d="M313 643 L313 652" fill="none" stroke="#5274A6" stroke-width="1.5"/><ellipse cx="313" cy="668" rx="16" ry="16" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="313" y="673.25">d</tspan></text><path d="M297 668 L181 696" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M329 668 L446 696" fill="none" stroke="#5274A6" stroke-width="1.5"/><rect x="81" y="696" width="200" height="28" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="181" y="715.25">individual_user</tspan></text><rect x="336" y="696" width="225" height="28" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="448.5" y="715.25">organization_user</tspan></text><rect x="54" y="721" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="740">Eksempel: individual_user og organization_user arver</tspan><tspan x="60" y="757.92">user.id. I undertabellerne kan user_id være PK og FK.</tspan></text><rect x="612" y="496" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="508" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="532">22  Disjunkt / overlappende · d / o</tspan></text><rect x="628" y="547" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="567">Hvad: afgør om en forekomst må være i flere undertyper.</tspan><tspan x="634" y="586.2">Brug: d = højst én; o = flere undertyper er tilladt.</tspan></text><ellipse cx="717.5" cy="666.5" rx="27.5" ry="27.5" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="24" text-anchor="middle"><tspan x="717.5" y="674.9">d</tspan></text><rect x="755" y="642" width="110" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="761" y="662">Disjunkt</tspan><tspan x="761" y="681.2">højst én</tspan></text><ellipse cx="942.5" cy="666.5" rx="27.5" ry="27.5" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="24" text-anchor="middle"><tspan x="942.5" y="674.9">o</tspan></text><rect x="980" y="642" width="155" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="986" y="662">Overlappende</tspan><tspan x="986" y="681.2">flere tilladt</tspan></text><rect x="628" y="721" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="740">Eksempel: d hvis en user ikke må være både individual</tspan><tspan x="634" y="757.92">og organization. Requester/contributor kan være roller.</tspan></text><rect x="38" y="794" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="54" y="806" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="60" y="830">23  Total / delvis specialisering</tspan></text><rect x="54" y="845" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="60" y="865">Hvad: afgør om alle forekomster skal have en undertype.</tspan><tspan x="60" y="884.2">Brug: dobbelt-/enkeltlinje fra overtypen til EER-cirklen.</tspan></text><rect x="76" y="939" width="110" height="45" fill="#EAF2FF" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="131" y="966.75">user</tspan></text><path d="M186 958 L246 958" fill="none" stroke="#5274A6" stroke-width="1.5"/><path d="M186 964 L246 964" fill="none" stroke="#5274A6" stroke-width="1.5"/><ellipse cx="267" cy="961" rx="21" ry="21" fill="#F0EAFE" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="267" y="966.25">d</tspan></text><rect x="321" y="929" width="245" height="75" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="327" y="949">Dobbeltlinje: mindst én</tspan><tspan x="327" y="968.2">Enkeltlinje: nul tilladt</tspan><tspan x="327" y="987.4">d / o er et separat valg.</tspan></text><rect x="54" y="1019" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="60" y="1038">Eksempel: dobbeltlinje + d kræver præcis én undertype.</tspan><tspan x="60" y="1055.92">Enkeltlinje + d tillader også en user uden undertype.</tspan></text><rect x="612" y="794" width="550" height="282" fill="#FFFFFF" stroke="#5274A6"/><rect x="628" y="806" width="518" height="32" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="19" font-weight="bold" text-anchor="start"><tspan x="634" y="830">24  Note / forretningsregel</tspan></text><rect x="628" y="845" width="518" height="65" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="start"><tspan x="634" y="865">Hvad: en regel, der ikke forklares af symbolerne alene.</tspan><tspan x="634" y="884.2">Brug: en kort note ved de relevante entiteter eller relationer.</tspan></text><rect x="655" y="919" width="465" height="85" fill="#FFF3DA" stroke="#5274A6"/><text fill="#172B4D" font-family="Arial" font-size="15" text-anchor="middle"><tspan x="887.5" y="947.55">REGEL</tspan><tspan x="887.5" y="966.75">Én user må højst have én aktiv</tspan><tspan x="887.5" y="985.9499999999999">ansøgning pr. task.</tspan></text><rect x="628" y="1019" width="518" height="49" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="14" text-anchor="start"><tspan x="634" y="1038">Eksempel: kun en accepteret ansøgning kan føre til</tspan><tspan x="634" y="1055.92">deltagelse. PK/FK og kardinalitet udtrykker ikke den regel.</tspan></text><rect x="38" y="1112" width="1120" height="48" fill="none" stroke="none"/><text fill="#172B4D" font-family="Arial" font-size="13" text-anchor="start"><tspan x="44" y="1130">Fælles konvention: tabelform for entiteter · Chen-romber for relationer · ingen pile</tspan><tspan x="44" y="1146.64">Eksemplerne viser mulige forretningsregler; vælg reglerne ud fra jeres eget system.</tspan></text></svg></section></html>
